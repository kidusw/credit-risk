# `docker compose up` on a fresh clone: Postgres, a one-shot bootstrap (migrate, then make
# sure both tracks have an exported model), then the API and the dashboard.
#   dashboard  http://localhost:8502
#   API docs   http://localhost:8001/docs
# Ports differ from Project 1 (8000/8501/5433) so both stacks can run side by side.

# Own project name, so volumes and containers don't collide with other portfolio projects.
name: crisk

x-build: &build
  context: .
  secrets: [ca_bundle]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crisk
      POSTGRES_PASSWORD: crisk
      POSTGRES_DB: crisk
    ports:
      - "${CRISK_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisk -d crisk"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: migrate, export or train what is missing (see `crisk bootstrap --help`), exit.
  bootstrap:
    build:
      <<: *build
      args:
        SYNC_ARGS: --no-default-groups --group train
    image: crisk-bootstrap
    command: ["crisk", "bootstrap"]
    environment:
      DATABASE_URL: postgresql+psycopg://crisk:crisk@db:5432/crisk
      MLFLOW_TRACKING_URI: sqlite:////app/data/mlflow.db
      # Optional: export KAGGLE_API_TOKEN first to train the real Lending Club model (~45 min).
      # Without it, Lending Club gets a DEMO model on synthetic LC-shaped loans.
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
    volumes:
      - crisk-data:/app/data
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *build
    image: crisk-api
    environment:
      DATABASE_URL: postgresql+psycopg://crisk:crisk@db:5432/crisk
      SERVING_DIR: /app/models/serving
    volumes:
      - ./models:/app/models:ro
    ports:
      - "${CRISK_API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboard:
    build:
      <<: *build
      args:
        SYNC_ARGS: --only-group dashboard
    image: crisk-dashboard
    command:
      ["streamlit", "run", "src/crisk/dashboard/app.py", "--server.address=0.0.0.0",
       "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      CRISK_API_URL: http://api:8000
      CRISK_REPORTS_DIR: /app/reports
    volumes:
      - ./reports:/app/reports:ro
    ports:
      - "${CRISK_DASHBOARD_PORT:-8502}:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  crisk-data:

secrets:
  # Optional extra CA bundle for TLS-intercepting networks, e.g.
  #   CRISK_CA_BUNDLE=C:/path/to/corporate-bundle.pem docker compose up --build
  # The default is an empty file, which the Dockerfile ignores.
  ca_bundle:
    file: ${CRISK_CA_BUNDLE:-./docker/no-extra-ca.pem}
